name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Validate Version, Test, and Tag
    runs-on: macos-15
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and resolve release metadata
        id: resolve
        run: |
          set -euo pipefail

          if [ ! -f "VERSION" ]; then
            echo "::error::VERSION ファイルが見つかりません。"
            exit 1
          fi

          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          if [[ ! "${FILE_VERSION}" =~ ${SEMVER_REGEX} ]]; then
            echo "::error::VERSION の値がセマンティックバージョニング形式ではありません: ${FILE_VERSION}"
            exit 1
          fi

          EVENT_NAME="${{ github.event_name }}"
          REF="${{ github.ref }}"
          TARGET_VERSION="${FILE_VERSION}"
          TAG_NAME="v${FILE_VERSION}"
          SHOULD_CREATE_TAG="false"

          if [ "${EVENT_NAME}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            TAG_VERSION="${TAG_NAME#v}"
            if [[ ! "${TAG_NAME}" =~ ^v ]] || [[ ! "${TAG_VERSION}" =~ ${SEMVER_REGEX} ]]; then
              echo "::error::リリースタグ名が SemVer 形式 (vX.Y.Z) ではありません: ${TAG_NAME}"
              exit 1
            fi
            if [ "${TAG_VERSION}" != "${FILE_VERSION}" ]; then
              echo "::error::タグ (${TAG_NAME}) と VERSION ファイル (${FILE_VERSION}) が一致しません。"
              exit 1
            fi
            TARGET_VERSION="${TAG_VERSION}"
          elif [ "${EVENT_NAME}" = "push" ] && [[ "${REF}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            TAG_VERSION="${TAG_NAME#v}"
            if [[ ! "${TAG_NAME}" =~ ^v ]] || [[ ! "${TAG_VERSION}" =~ ${SEMVER_REGEX} ]]; then
              echo "::error::タグ名が SemVer 形式 (vX.Y.Z) ではありません: ${TAG_NAME}"
              exit 1
            fi
            if [ "${TAG_VERSION}" != "${FILE_VERSION}" ]; then
              echo "::error::タグ (${TAG_NAME}) と VERSION ファイル (${FILE_VERSION}) が一致しません。"
              exit 1
            fi
            TARGET_VERSION="${TAG_VERSION}"
          else
            # main ブランチへの VERSION 更新 push または workflow_dispatch
            if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
              if [ "${EVENT_NAME}" = "push" ]; then
                echo "::error::タグ ${TAG_NAME} は既に存在するため自動リリースを中止しました。"
                exit 1
              fi
              echo "既存タグ ${TAG_NAME} を使用してリリース処理を継続します。"
            else
              SHOULD_CREATE_TAG="true"
            fi
          fi

          IS_PRERELEASE="false"
          if [[ "${TARGET_VERSION}" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          echo "version=${TARGET_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${IS_PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "should_create_tag=${SHOULD_CREATE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "target_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Run unit tests
        run: swift test

      - name: Create and push tag
        if: steps.resolve.outputs.should_create_tag == 'true'
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.resolve.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "refs/tags/${TAG_NAME}"

  release:
    name: Build, Notarize, and Publish Release
    needs: prepare
    runs-on: macos-15
    concurrency:
      group: release-${{ needs.prepare.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}
          fetch-depth: 0

      - name: Validate required secrets
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          for var in MACOS_CERT_BASE64 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY NOTARY_KEY_BASE64 NOTARY_KEY_ID; do
            if [ -z "${!var:-}" ]; then
              echo "::error::必須の GitHub Secret (${var}) が設定されていません。"
              exit 1
            fi
          done
          if [ "${{ needs.prepare.outputs.is_prerelease }}" != "true" ] && [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::安定版リリースには HOMEBREW_TAP_TOKEN が必要です。"
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="${RUNNER_TEMP}/cert.p12"
          trap 'rm -f "${CERT_PATH}"' EXIT

          # Base64 化された .p12 証明書を一時ファイルへ復元する
          printf '%s' "${MACOS_CERT_BASE64}" | tr -d '[:space:]' | base64 --decode > "${CERT_PATH}"

          # ビルド・署名用の一時キーチェーンを作成して証明書をインポートする
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -P "${MACOS_CERT_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security list-keychain -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"

      - name: Build and sign Universal Binary .app bundle
        env:
          WINTCH_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: ./scripts/build-app.sh release --universal

      - name: Verify bundle metadata and architectures
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${{ needs.prepare.outputs.version }}"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ./.build/Wintch.app/Contents/Info.plist)"
          if [ "${ACTUAL_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Info.plist のバージョン (${ACTUAL_VERSION}) が期待値 (${EXPECTED_VERSION}) と一致しません。"
            exit 1
          fi

          ARCHS="$(lipo -archs ./.build/Wintch.app/Contents/MacOS/Wintch)"
          echo "Built architectures: ${ARCHS}"
          if [[ "${ARCHS}" != *"arm64"* ]] || [[ "${ARCHS}" != *"x86_64"* ]]; then
            echo "::error::Universal Binary (arm64 + x86_64) の生成確認に失敗しました (${ARCHS})。"
            exit 1
          fi

      - name: Notarize, staple, and package release ZIP and DMG
        id: package
        env:
          WINTCH_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          TAG_NAME="${{ needs.prepare.outputs.tag_name }}"
          NOTARIZE_ZIP="./.build/Wintch-notarize.zip"
          FINAL_ZIP="./.build/Wintch-${TAG_NAME}.zip"
          FINAL_DMG="./.build/Wintch-${TAG_NAME}.dmg"
          KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          trap 'rm -f "${KEY_PATH}" "${NOTARIZE_ZIP}"' EXIT

          # App Store Connect API Key を復元して権限を制限する
          printf '%s' "${NOTARY_KEY_BASE64}" | tr -d '[:space:]' | base64 --decode > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"

          NOTARY_AUTH_ARGS=(
            --key "${KEY_PATH}"
            --key-id "${NOTARY_KEY_ID}"
          )
          if [ -n "${NOTARY_ISSUER_ID:-}" ]; then
            NOTARY_AUTH_ARGS+=(--issuer "${NOTARY_ISSUER_ID}")
          fi

          # Apple 公証サーバーへ提出して結果を検証する共通関数
          submit_and_wait_notary() {
            local artifact_path="$1"
            local artifact_label="$2"
            local submit_json submit_exit parsed_result notary_status submission_id

            set +e
            submit_json="$(xcrun notarytool submit "${artifact_path}" "${NOTARY_AUTH_ARGS[@]}" --wait --output-format json)"
            submit_exit=$?
            set -e
            echo "${submit_json}"

            parsed_result="$(SUBMIT_JSON="${submit_json}" python3 -c 'import json, os; d = json.loads(os.environ.get("SUBMIT_JSON") or "{}"); print(d.get("status", "")); print(d.get("id", ""))')"
            notary_status="$(printf '%s\n' "${parsed_result}" | sed -n '1p')"
            submission_id="$(printf '%s\n' "${parsed_result}" | sed -n '2p')"

            if [ "${submit_exit}" -ne 0 ] || [ "${notary_status}" != "Accepted" ]; then
              echo "::error::${artifact_label} の Apple 公証に失敗しました (status=${notary_status:-unknown}, id=${submission_id:-unknown})。"
              if [ -n "${submission_id}" ]; then
                xcrun notarytool log "${submission_id}" "${NOTARY_AUTH_ARGS[@]}" || true
              fi
              exit 1
            fi
          }

          # チケット反映遅延に備えてリトライしながら Staple と検証を実行する共通関数
          staple_with_retry() {
            local target_path="$1"
            local stapled="false"

            for attempt in 1 2 3 4 5; do
              if xcrun stapler staple "${target_path}"; then
                stapled="true"
                break
              fi
              echo "stapler staple のリトライを待機しています (${target_path}, ${attempt}/5)..."
              sleep 10
            done
            if [ "${stapled}" != "true" ]; then
              echo "::error::公証チケットの添付 (stapler staple) に失敗しました (${target_path})。"
              exit 1
            fi

            xcrun stapler validate "${target_path}"
          }

          # 公証提出用の一時 ZIP を作成して .app を公証・Staple・検証する
          ditto -c -k --keepParent ./.build/Wintch.app "${NOTARIZE_ZIP}"
          submit_and_wait_notary "${NOTARIZE_ZIP}" "Wintch.app"
          staple_with_retry ./.build/Wintch.app
          spctl -a -vvv -t exec ./.build/Wintch.app

          # 公証チケット添付済みの最終配布 ZIP と SHA256 を生成する
          ditto -c -k --keepParent ./.build/Wintch.app "${FINAL_ZIP}"
          SHA256="$(shasum -a 256 "${FINAL_ZIP}" | awk '{print $1}')"
          echo "Release ZIP SHA256: ${SHA256}"
          echo "sha256=${SHA256}" >> "${GITHUB_OUTPUT}"

          # 公証済み .app を格納した DMG を生成・署名し、DMG 本体も公証・Staple・検証する
          ./scripts/build-dmg.sh --app ./.build/Wintch.app --output "${FINAL_DMG}" --volname "Wintch"
          submit_and_wait_notary "${FINAL_DMG}" "Wintch-${TAG_NAME}.dmg"
          staple_with_retry "${FINAL_DMG}"
          spctl -a -t open --context context:primary-signature -vvv "${FINAL_DMG}"

          DMG_SHA256="$(shasum -a 256 "${FINAL_DMG}" | awk '{print $1}')"
          echo "Release DMG SHA256: ${DMG_SHA256}"
          echo "dmg_sha256=${DMG_SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_NAME="${{ needs.prepare.outputs.tag_name }}"
          ZIP_PATH="./.build/Wintch-${TAG_NAME}.zip"
          DMG_PATH="./.build/Wintch-${TAG_NAME}.dmg"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${ZIP_PATH}" "${DMG_PATH}" --clobber
          else
            CREATE_ARGS=(
              "${TAG_NAME}"
              "${ZIP_PATH}"
              "${DMG_PATH}"
              --target "${{ needs.prepare.outputs.target_sha }}"
              --title "Wintch ${TAG_NAME}"
              --generate-notes
            )
            if [ "${{ needs.prepare.outputs.is_prerelease }}" = "true" ]; then
              CREATE_ARGS+=(--prerelease)
            fi
            gh release create "${CREATE_ARGS[@]}"
          fi

      - name: Update Homebrew Tap Cask
        if: needs.prepare.outputs.is_prerelease != 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          TAP_DIR="${RUNNER_TEMP}/homebrew-tap"
          rm -rf "${TAP_DIR}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_OWNER}/homebrew-tap.git" "${TAP_DIR}"
          cd "${TAP_DIR}"

          CASK_FILE="Casks/wintch.rb"
          if [ ! -f "${CASK_FILE}" ]; then
            echo "::error::${TAP_OWNER}/homebrew-tap に ${CASK_FILE} が見つかりません。"
            exit 1
          fi

          # Cask 定義の version と sha256 を新しいリリース情報で更新する
          python3 -c '
          import os, re

          cask_path = "Casks/wintch.rb"
          version = os.environ["VERSION"]
          sha256 = os.environ["SHA256"]
          q = chr(34)

          with open(cask_path, "r", encoding="utf-8") as f:
              content = f.read()

          updated, ver_count = re.subn(
              r"^(\s*version\s+)" + q + r"[^" + q + r"]*" + q,
              rf"\g<1>{q}{version}{q}",
              content,
              count=1,
              flags=re.MULTILINE,
          )
          if ver_count != 1:
              raise RuntimeError("Casks/wintch.rb 内の version 行を更新できませんでした")

          updated, sha_count = re.subn(
              r"^(\s*sha256\s+)(?::no_check|" + q + r"[^" + q + r"]*" + q + r")",
              rf"\g<1>{q}{sha256}{q}",
              updated,
              count=1,
              flags=re.MULTILINE,
          )
          if sha_count != 1:
              raise RuntimeError("Casks/wintch.rb 内の sha256 行を更新できませんでした")

          with open(cask_path, "w", encoding="utf-8") as f:
              f.write(updated)
          '

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${CASK_FILE}"
          if ! git diff --cached --quiet; then
            git commit -m "wintch ${VERSION} へ更新"
            git push origin HEAD
          else
            echo "Casks/wintch.rb に変更はありませんでした。"
          fi

      - name: Clean up temporary keychain
        if: always()
        run: security delete-keychain "${RUNNER_TEMP}/app-signing.keychain-db" || true
