<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <!-- macOS メニューバー用テンプレートアイコン（AppIcon のウィンチ・ロープ・フックリング部分をそのまま切り出し） -->
  <!-- ウィンチ「◎」とフックリング「o」を結ぶロープ（内側リング穴にはみ出さない端点配置） -->
  <line
    x1="8.85"
    y1="8.91"
    x2="6.03"
    y2="12.64"
    stroke="#000000"
    stroke-width="1.65"
    stroke-linecap="butt"
  />
  <!-- ロープ先端のフックリング -->
  <circle cx="5.0" cy="14.0" r="1.7" fill="none" stroke="#000000" stroke-width="1.5" />
  <!-- 右上のウィンチ「◎」（外輪＋中心軸） -->
  <circle cx="11.2" cy="5.8" r="3.9" fill="none" stroke="#000000" stroke-width="1.85" />
  <circle cx="11.2" cy="5.8" r="1.35" fill="#000000" />
</svg>
